[project]
name = "ultima-scraper-backend"
version = "0.2.0"
description = "USR backend API, control plane, and worker service"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "UltimaHoarder", email = "21285176+UltimaHoarder@users.noreply.github.com" },
]
dependencies = [
    "anyio>=4.12,<5",
    "ujson>=5,<6",
    "fastapi>=0.135,<0.136",
    "uvicorn[standard]>=0.41,<0.42",
    "httpx>=0.28,<0.29",
    "python-multipart>=0.0.22,<0.1",
    "pydantic[email]>=2.12,<3",
    "redis[hiredis]>=6.2.0,<7.0.0",
    "ultima-scraper-api>=3.0.0b5,<4",
    "ultima-scraper-core>=0.1,<1",
    "ultima-scraper-db>=0.5,<1",
    "ultima-scraper-db-archive>=0.3,<1",
    "sqlmodel>=0.0.24",
    "apscheduler>=3.11,<4",
    "packaging>=24,<27",
    "jsonschema>=4.23,<5",
    "platformdirs>=4.5",
    "psutil>=7.2,<8",
    "websockets>=15,<16",
    "alembic>=1.18,<2",
    "asyncpg>=0.31,<1",
    "psycopg[binary]>=3.3,<4",
    "greenlet>=3.2,<4",
    "uvloop>=0.21; sys_platform != 'win32'",
]

[project.urls]
Homepage = "https://github.com/UltimaHoarder/UltimaScraperBackend"
Repository = "https://github.com/UltimaHoarder/UltimaScraperBackend"
Issues = "https://github.com/UltimaHoarder/UltimaScraperBackend/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ultima_scraper_backend"]

[tool.uv.sources]
ultima-scraper-core = { git = "https://github.com/UltimaHoarder/UltimaScraperCore.git", branch = "main" }
ultima-scraper-api = { git = "https://github.com/UltimaHoarder/UltimaScraperAPI.git", branch = "main" }
ultima-scraper-db = { git = "https://github.com/DATAHOARDERS/UltimaScraperDB.git", branch = "main" }
ultima-scraper-db-archive = { git = "https://github.com/UltimaHoarder/UltimaScraperDBArchive.git", branch = "main" }
